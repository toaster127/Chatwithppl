    }

    header {

      background: linear-gradient(90deg, #1f1a3d, #2d183b);

      justify-content: space-between;
      align-items: center;
    }

    .brand {

    }

    .logo-dot {

      background-color: #00f5d4;

    .room-row {

      gap: 8px;
    }

    .icon-btn {
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid #ec4899;
      background-color: #2d183b;
      font-size: 1.25rem;
      cursor: pointer;
      color: white;
    }

    .primary-btn {
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
    }

    #chat-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background-color: #0c0a1d;

      font-size: 0.8rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .copy-btn {
      background-color: rgba(0, 245, 212, 0.15);
      color: #00f5d4;
      border: 1px solid #00f5d4;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      background-color: #242047;
      padding: 11px 15px;
      border-radius: 18px 18px 18px 4px;
      max-width: 78%;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
      border: 1px solid #6d28d9;
    }

    .msg.mine {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      align-self: flex-end;
      border-radius: 18px 18px 4px 18px;
      border: none;
      color: #ffffff;
    }

    .msg.system {
      align-self: center;
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 20px;
      color: #cbd5e1;
      font-size: 0.75rem;
      padding: 4px 12px;
    }

    .sender {
      font-size: 0.72rem;
      font-weight: 700;
      color: #00f5d4;
      display: block;
      margin-bottom: 3px;
    }

    .msg.mine .sender {
      display: none;
    }

    #chat-form {
      display: flex;
      padding: 14px;
      background-color: #110f24;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      gap: 10px;
    }

    #chat-form input {
      flex: 1;
      border-radius: 24px;
      padding: 12px 18px;
    }

    .send-btn {
      padding: 0 22px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(90deg, #00f5d4, #38bdf8);
      color: #090c10;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <div class="logo-dot"></div>
      <h2>DuoChat</h2>
    </div>
    <a href="https://github.com/toaster127" target="_blank" class="gh-link">@toaster127 ↗</a>
  </header>

  <!-- Setup Screen -->
  <div id="setup-screen">
    <div class="hero-text">
      <h3>Private 2-Person Chat</h3>
      <p>No signups. Generate a room, copy the invite link, and start texting.</p>
    </div>

    <div class="input-group">
      <label for="name-input">Your Display Name</label>
      <input type="text" id="name-input" placeholder="Quantavius McBasketball" maxlength="99">
    </div>

    <div class="input-group">
      <label for="room-input">Secret Room Code</label>
      <div class="room-row">
        <input type="text" id="room-input" placeholder="Enter or generate code">
        <button type="button" id="generate-btn" class="icon-btn">🎲</button>
      </div>
    </div>

    <button type="button" id="join-btn" class="primary-btn">Enter Chat Room</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div class="status-bar">
      <span id="connection-status">Connecting...</span>
      <button type="button" id="copy-link-btn" class="copy-btn">Copy Invite Link</button>
    </div>

    <div id="messages"></div>

    <form id="chat-form">
      <input type="text" id="msg-input" placeholder="Write a message..." autocomplete="off" required>
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>
</div>
