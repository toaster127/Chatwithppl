<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoChat | By @toaster127</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <div class="logo-dot"></div>
      <h2>DuoChat</h2>
    </div>
    <a href="https://github.com/toaster127" target="_blank" class="gh-link">@toaster127 ↗</a>
  </header>

  <!-- Setup Screen -->
  <div id="setup-screen">
    <div class="hero-text">
      <h3>Private 2-Person Chat</h3>
      <p>No signups. Generate a room, copy the invite link, and start texting.</p>
    </div>

    <div class="input-group">
      <label for="name-input">Your Display Name</label>
      <input type="text" id="name-input" placeholder="e.g. Tyler" maxlength="16">
    </div>

    <div class="input-group">
      <label for="room-input">Secret Room Code</label>
      <div class="room-row">
        <input type="text" id="room-input" placeholder="Enter or generate code">
        <button type="button" id="generate-btn" class="icon-btn" title="Generate Random Code">🎲</button>
      </div>
    </div>

    <button id="join-btn" class="primary-btn">Enter Chat Room</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div class="status-bar">
      <span id="connection-status">Connecting...</span>
      <button type="button" id="copy-link-btn" class="copy-btn">Copy Invite Link</button>
    </div>

    <div id="messages"></div>

    <form id="chat-form">
      <input type="text" id="msg-input" placeholder="Write a message..." autocomplete="off" required>
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
