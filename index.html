<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoChat | By @toaster127</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d0b1f;
      background-image: radial-gradient(circle at 20% 20%, #2a1659 0%, #0d0b1f 55%),
                        radial-gradient(circle at 80% 80%, #3b1245 0%, #0d0b1f 55%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      height: 82vh;
      max-height: 700px;
      background-color: #16142c;
      border: 2px solid #8b5cf6;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(139, 92, 246, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 18px 22px;
      background: linear-gradient(90deg, #1f1a3d, #2d183b);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 11px;
      height: 11px;
      background-color: #00f5d4;
      border-radius: 50%;
      box-shadow: 0 0 12px #00f5d4;
    }

    header h2 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #00f5d4;
    }

    .gh-link {
      color: #f0abfc;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: rgba(217, 70, 239, 0.2);
      border: 1px solid #d946ef;
    }

    /* Setup Screen */
    #setup-screen {
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      flex: 1;
    }

    .hero-text h3 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #e879f9;
    }

    .hero-text p {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #38bdf8;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid #6d28d9;
      background-color: #0c0a1d;
      color: #ffffff;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: #00f5d4;
    }

    .room-row {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid #ec4899;
      background-color: #2d183b;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .primary-btn {
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
    }

    /* Chat Screen */
    #chat-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background-color: #0c0a1d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .copy-btn {
      background-color: rgba(0, 245, 212, 0.15);
      color: #00f5d4;
      border: 1px solid #00f5d4;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      background-color: #242047;
      padding: 11px 15px;
      border-radius: 18px 18px 18px 4px;
      max-width: 78%;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
      border: 1px solid #6d28d9;
    }

    .msg.mine {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      align-self: flex-end;
      border-radius: 18px 18px 4px 18px;
      border: none;
      color: #ffffff;
    }

      align-self: center;
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 20px;
      color: #cbd5
