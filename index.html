<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuoChat | By @toaster127</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a103c);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 16px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 440px;
      height: 85vh;
      max-height: 740px;
      background: rgba(15, 17, 30, 0.85);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 24px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.75),
        0 0 30px rgba(139, 92, 246, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 18px 22px;
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.15));
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 11px;
      height: 11px;
      background: #00f5d4;
      border-radius: 50%;
      box-shadow: 0 0 12px #00f5d4, 0 0 24px #00f5d4;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.75; }
    }

    header h2 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #00f5d4, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gh-link {
      color: #f0abfc;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(217, 70, 239, 0.18);
      border: 1px solid rgba(217, 70, 239, 0.4);
      transition: all 0.25s ease;
    }

    .gh-link:hover {
      background: rgba(217, 70, 239, 0.35);
      box-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
      transform: translateY(-1px);
    }

    /* Setup Screen */
    #setup-screen {
      padding: 32px 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      flex: 1;
    }

    .hero-text h3 {
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38bdf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #c084fc;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      background: rgba(10, 12, 24, 0.85);
      color: #ffffff;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    input:focus {
      outline: none;
      border-color: #00f5d4;
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
    }

    .room-row {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid rgba(236, 72, 153, 0.45);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(236, 72, 153, 0.25));
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(236, 72, 153, 0.4));
      box-shadow: 0 0 14px rgba(236, 72, 153, 0.4);
      transform: rotate(15deg) scale(1.05);
    }

    .primary-btn {
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #00f5d4, #7b2cbf, #f72585);
      background-size: 200% auto;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(247, 37, 133, 0.45);
      transition: all 0.3s ease;
    }

    .primary-btn:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 245, 212, 0.5);
    }

    /* Chat Screen (Hidden by default) */
    #chat-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 18px;
      background: rgba(10, 12, 24, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .copy-btn {
      background: linear-gradient(135deg, rgba(0, 245, 212, 0.2), rgba(56, 189, 248, 0.2));
      color: #00f5d4;
      border: 1px solid rgba(0, 245, 212, 0.45);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: rgba(0, 245, 212, 0.35);
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.4);
    }

    #messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #a855f7, #ec4899);
      border-radius: 3px;
    }

    .msg {
      background: rgba(30, 35, 60, 0.9);
      padding: 11px 15px;
      border-radius: 18px 18px 18px 4px;
      max-width: 78%;
      word-break: break-word;
      font-size: 0.94rem;
      line-height: 1.4;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .msg.mine {
      background: linear-gradient(135deg, #7b2cbf, #ec4899);
      align-self: flex-end;
      border-radius: 18px 18px 4px
